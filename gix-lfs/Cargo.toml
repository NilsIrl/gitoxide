lints.workspace = true

[package]
name = "gix-lfs"
version = "0.0.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing with handling git large file support"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.85"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false

[dependencies]
gix-hash = { version = "^0.25.1", path = "../gix-hash", default-features = false, features = ["sha256"] }
gix-config = { version = "^0.57.0", path = "../gix-config" }
gix-discover = { version = "^0.52.0", path = "../gix-discover" }
gix-path = { version = "^0.12.1", path = "../gix-path" }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }
thiserror = "2.0.0"
serde = { version = "1.0.114", features = ["derive"] }
serde_json = "1.0"
ureq = "2.10"
base64 = "0.22"

[dev-dependencies]
gix-testtools = { path = "../tests/tools" }
